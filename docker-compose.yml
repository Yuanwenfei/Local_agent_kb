# 注：compose 的顶层 `version` 字段已废弃（docker compose v2 会告警），故不再声明
services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: local_kb_qdrant
    ports:
      # 只绑回环：Qdrant 默认无鉴权，之前 `6333:6333` 会监听 0.0.0.0（局域网可读写）
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC（可选）
    volumes:
      # 使用 Docker named volume 替代 bind mount
      # 根因：Windows bind mount 对 mmap 写入同步不可靠，
      # 导致 Qdrant 段优化时向量数据被归零（膨胀比12.57x后触发）
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  qdrant_data:
    name: local_kb_qdrant_data
